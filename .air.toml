# Air config — go-live-reload during development.
# Run with: make dev    (or directly: `air`, after `go install github.com/air-verse/air@latest`)
#
# Watches Go sources, rebuilds, and restarts the binary. Static SPA assets
# under internal/web/static/app/ are NOT watched here — run `npm run dev`
# in spa/ for SPA HMR (or `npm run build` + page refresh for embed-mode).

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  bin = "./tmp/feedrig"
  cmd = "go build -o ./tmp/feedrig ."
  delay = 500
  exclude_dir = [
    "tmp",
    "data",
    "media",
    "spa",
    "internal/web/static/app",
  ]
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "html", "css", "js", "sql"]
  kill_delay = "1s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_root = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
